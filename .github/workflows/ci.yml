name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run Python tests
        run: python -m pytest -v
      - name: Check public repository contents
        run: python scripts/check_publication.py --root .
      - name: Check bilingual project description version
        run: python scripts/check_description.py --root .
      - name: Check browser bundle syntax
        run: node --check web/app.js
