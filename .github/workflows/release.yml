name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run release test gate
        run: python -m pytest -v
      - name: Run publication gate
        run: python scripts/check_publication.py --root .
      - name: Check bilingual project description version
        run: python scripts/check_description.py --root .
      - name: Check browser bundle syntax
        run: node --check web/app.js
      - name: Decide whether this is a product release
        id: scope
        shell: bash
        run: |
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || printf '%s\n' "$changed" | grep -Eq '^(src/|web/|scripts/|pyproject\.toml$|uv\.lock$)'; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read package version
        if: steps.scope.outputs.product == 'true'
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build clean source archive
        if: steps.scope.outputs.product == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi
          mkdir -p dist
          git archive --format=tar.gz --prefix="open-agent-artifacts-${VERSION}/" "$GITHUB_SHA" > "dist/open-agent-artifacts-${VERSION}.tar.gz"
          (cd dist && sha256sum "open-agent-artifacts-${VERSION}.tar.gz" > "open-agent-artifacts-${VERSION}.tar.gz.sha256")
      - name: Create GitHub Release
        if: steps.scope.outputs.product == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" dist/* --title "$tag" --generate-notes
