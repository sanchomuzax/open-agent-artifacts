name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run release test gate
        run: python -m pytest -v
      - name: Run publication gate
        run: python scripts/check_publication.py --root .
      - name: Check bilingual project description version
        run: python scripts/check_description.py --root .
      - name: Check browser bundle syntax
        run: node --check web/app.js
      - name: Decide whether this is a product release
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/release_scope.py --event "$GITHUB_EVENT_NAME" --before "$BEFORE_SHA" --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Build release description from changelog
        if: steps.scope.outputs.release_needed == 'true'
        env:
          VERSION: ${{ steps.scope.outputs.version }}
        run: |
          mkdir -p dist
          python scripts/release_notes.py --version "$VERSION" > dist/release-notes.md
          test -s dist/release-notes.md
      - name: Build clean source archive
        if: steps.scope.outputs.release_needed == 'true'
        env:
          VERSION: ${{ steps.scope.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="open-agent-artifacts-${VERSION}/" "$GITHUB_SHA" > "dist/open-agent-artifacts-${VERSION}.tar.gz"
          (cd dist && sha256sum "open-agent-artifacts-${VERSION}.tar.gz" > "open-agent-artifacts-${VERSION}.tar.gz.sha256")
      - name: Create GitHub Release
        if: steps.scope.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.scope.outputs.version }}
        run: |
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" dist/open-agent-artifacts-"${VERSION}".tar.gz dist/open-agent-artifacts-"${VERSION}".tar.gz.sha256 --title "$tag" --notes-file dist/release-notes.md
          body="$(gh release view "$tag" --json body --jq .body)"
          printf '%s\n' "$body" | grep -Fq "## ${VERSION}"
          printf '%s\n' "$body" | grep -Eq '^[[:space:]]*-[[:space:]]+[^[:space:]]'
