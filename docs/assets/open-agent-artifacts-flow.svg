<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Open Agent Artifacts workflow</title>
  <desc id="desc">An AI agent publishes a safe, versioned artifact. A human reviews and comments in the workspace, and the agent creates a new immutable version.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#273844" stroke-width="1" opacity="0.26"/>
    </pattern>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#79dfc4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8fb9ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2.1px}.heading{font-size:31px;font-weight:760;letter-spacing:-1.5px}.sub{font-size:14px;fill:#8fa4aa}.node-title{font-size:15px;font-weight:750;fill:#edf5f4}.node-sub{font-size:11px;fill:#8fa4aa}.tiny{font-size:10px;fill:#8fa4aa}.label{font-size:11px;font-weight:750;letter-spacing:.7px}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#101820;stroke:#273844;stroke-width:1}.inner{fill:#0b1218;stroke:#273844;stroke-width:1}.mint{fill:#79dfc4}.mint-text{fill:#b9f4e6}.blue{fill:#8fb9ff}.yellow{fill:#f3ce74}.muted{fill:#8fa4aa}.white{fill:#edf5f4}
    </style>
  </defs>

  <rect width="1200" height="680" rx="24" fill="#080d12"/>
  <rect width="1200" height="680" rx="24" fill="url(#grid)"/>
  <circle cx="985" cy="-45" r="285" fill="#21434b" opacity="0.34"/>
  <circle cx="1020" cy="35" r="150" fill="#79dfc4" opacity="0.035"/>

  <!-- Header -->
  <g class="sans">
    <rect x="54" y="48" width="42" height="42" rx="13" fill="#79dfc4" fill-opacity="0.08" stroke="#79dfc4" stroke-opacity="0.52"/>
    <path d="M75 57l2.8 10.2L88 70l-10.2 2.8L75 83l-2.8-10.2L62 70l10.2-2.8L75 57z" fill="#79dfc4"/>
    <text x="112" y="61" class="eyebrow mint">OPEN AGENT</text>
    <text x="112" y="88" class="heading white">Artifacts</text>
    <text x="1146" y="66" text-anchor="end" class="eyebrow muted">CREATE · REVIEW · EVOLVE</text>
    <text x="1146" y="88" text-anchor="end" class="sub">A private-by-default workspace for agent work</text>
  </g>

  <!-- Main loop arrows, rendered behind cards -->
  <path d="M284 311H358" class="line" stroke="#79dfc4" stroke-width="2" marker-end="url(#arrow-mint)"/>
  <path d="M842 311H916" class="line" stroke="#79dfc4" stroke-width="2" marker-end="url(#arrow-mint)"/>
  <path d="M1015 459C1015 566 845 600 601 600C357 600 185 566 185 459" class="line" stroke="#8fb9ff" stroke-width="1.7" stroke-dasharray="6 7" marker-end="url(#arrow-blue)"/>

  <!-- Left: agent -->
  <g class="sans" filter="url(#soft-shadow)">
    <rect x="54" y="166" width="230" height="293" rx="18" class="card"/>
    <text x="78" y="195" class="eyebrow mint">01 · CREATE</text>
    <text x="78" y="223" class="node-title">Any AI agent</text>
    <text x="78" y="244" class="node-sub">Generates useful, reviewable work</text>

    <rect x="78" y="271" width="182" height="118" rx="12" class="inner"/>
    <circle cx="113" cy="306" r="17" fill="#79dfc4" fill-opacity="0.12" stroke="#79dfc4" stroke-opacity="0.6"/>
    <path d="M113 296v20M103 306h20" stroke="#79dfc4" stroke-width="1.8" stroke-linecap="round"/>
    <text x="142" y="302" class="node-title">Publish</text>
    <text x="142" y="322" class="node-sub">via API or adapter</text>
    <path d="M96 352h146" stroke="#273844"/>
    <text x="96" y="372" class="mono tiny">markdown · code · html · svg</text>

    <rect x="78" y="409" width="58" height="26" rx="13" fill="#79dfc4" fill-opacity="0.10" stroke="#79dfc4" stroke-opacity="0.36"/>
    <text x="107" y="426" text-anchor="middle" class="mono tiny mint-text">Hermes</text>
    <rect x="144" y="409" width="52" height="26" rx="13" fill="#8fb9ff" fill-opacity="0.10" stroke="#8fb9ff" stroke-opacity="0.36"/>
    <text x="170" y="426" text-anchor="middle" class="mono tiny blue">Claude</text>
    <rect x="204" y="409" width="56" height="26" rx="13" fill="#f3ce74" fill-opacity="0.08" stroke="#f3ce74" stroke-opacity="0.32"/>
    <text x="232" y="426" text-anchor="middle" class="mono tiny yellow">Any agent</text>
  </g>

  <!-- Center: product workspace -->
  <g class="sans" filter="url(#soft-shadow)">
    <rect x="358" y="132" width="484" height="360" rx="20" fill="#101820" stroke="#3c5562" stroke-width="1.2"/>
    <rect x="359" y="133" width="482" height="58" rx="19" fill="#151f29"/>
    <path d="M359 191h482" stroke="#273844"/>
    <circle cx="384" cy="162" r="4" fill="#ef9898"/>
    <circle cx="400" cy="162" r="4" fill="#f3ce74"/>
    <circle cx="416" cy="162" r="4" fill="#79dfc4"/>
    <text x="438" y="167" class="mono tiny">artifact workspace</text>
    <rect x="692" y="148" width="124" height="29" rx="8" fill="#0e151c" stroke="#273844"/>
    <text x="708" y="167" class="mono tiny">⌕  Search</text>

    <text x="388" y="223" class="eyebrow mint">02 · REVIEW</text>
    <text x="388" y="251" class="node-title">One stable link. Every version.</text>

    <!-- artifact document -->
    <rect x="388" y="272" width="270" height="184" rx="12" class="inner"/>
    <rect x="408" y="291" width="104" height="11" rx="5.5" fill="#b9f4e6" opacity="0.84"/>
    <rect x="408" y="315" width="222" height="5" rx="2.5" fill="#3c5562"/>
    <rect x="408" y="328" width="194" height="5" rx="2.5" fill="#273844"/>
    <rect x="408" y="341" width="211" height="5" rx="2.5" fill="#273844"/>
    <rect x="408" y="367" width="230" height="42" rx="7" fill="#f3ce74" fill-opacity="0.08" stroke="#f3ce74" stroke-opacity="0.32"/>
    <rect x="420" y="378" width="158" height="6" rx="3" fill="#f3ce74" opacity="0.78"/>
    <rect x="420" y="392" width="196" height="5" rx="2.5" fill="#6b6044"/>
    <rect x="408" y="426" width="178" height="5" rx="2.5" fill="#273844"/>
    <text x="408" y="447" class="mono tiny">safe, sandboxed presentation</text>

    <!-- review rail -->
    <rect x="674" y="272" width="138" height="184" rx="12" fill="#151f29" stroke="#273844"/>
    <text x="690" y="296" class="label white">COMMENTS</text>
    <circle cx="788" cy="292" r="10" fill="#79dfc4" fill-opacity="0.12" stroke="#79dfc4" stroke-opacity="0.5"/>
    <text x="788" y="296" text-anchor="middle" class="mono tiny mint-text">2</text>
    <rect x="690" y="313" width="106" height="56" rx="8" fill="#101820" stroke="#273844"/>
    <rect x="700" y="326" width="74" height="5" rx="2.5" fill="#79dfc4" opacity="0.64"/>
    <rect x="700" y="339" width="84" height="4" rx="2" fill="#3c5562"/>
    <text x="700" y="359" class="mono tiny">Open</text>
    <rect x="690" y="379" width="106" height="56" rx="8" fill="#101820" stroke="#273844"/>
    <rect x="700" y="392" width="58" height="5" rx="2.5" fill="#8fb9ff" opacity="0.66"/>
    <rect x="700" y="405" width="84" height="4" rx="2" fill="#3c5562"/>
    <text x="700" y="425" class="mono tiny">Addressed</text>
  </g>

  <!-- Right: human -->
  <g class="sans" filter="url(#soft-shadow)">
    <rect x="916" y="166" width="230" height="293" rx="18" class="card"/>
    <text x="940" y="195" class="eyebrow blue">03 · FEEDBACK</text>
    <text x="940" y="223" class="node-title">Human in the loop</text>
    <text x="940" y="244" class="node-sub">Reviews context, not a loose chat</text>

    <circle cx="1031" cy="309" r="44" fill="#8fb9ff" fill-opacity="0.08" stroke="#8fb9ff" stroke-opacity="0.44"/>
    <circle cx="1031" cy="295" r="12" fill="none" stroke="#8fb9ff" stroke-width="2"/>
    <path d="M1008 330c3-15 14-22 23-22s20 7 23 22" fill="none" stroke="#8fb9ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M985 377h92" stroke="#273844"/>

    <g>
      <circle cx="955" cy="402" r="5" fill="#f3ce74"/>
      <text x="969" y="406" class="node-sub">Select exact passage</text>
      <circle cx="955" cy="427" r="5" fill="#79dfc4"/>
      <text x="969" y="431" class="node-sub">Leave anchored feedback</text>
    </g>
  </g>

  <!-- Bottom version loop label -->
  <g class="sans">
    <rect x="432" y="548" width="338" height="82" rx="17" fill="#101820" stroke="#8fb9ff" stroke-opacity="0.42"/>
    <rect x="451" y="566" width="48" height="46" rx="10" fill="#8fb9ff" fill-opacity="0.10" stroke="#8fb9ff" stroke-opacity="0.35"/>
    <path d="M463 589h24M475 577v24" stroke="#8fb9ff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="516" y="584" class="eyebrow blue">04 · EVOLVE</text>
    <text x="516" y="606" class="node-title">New immutable version</text>
    <rect x="690" y="570" width="58" height="23" rx="11.5" fill="#79dfc4" fill-opacity="0.10" stroke="#79dfc4" stroke-opacity="0.34"/>
    <text x="719" y="585" text-anchor="middle" class="mono tiny mint-text">v2</text>
  </g>

  <!-- footer -->
  <g class="sans">
    <text x="54" y="650" class="mono tiny">PRIVATE BY DEFAULT</text>
    <circle cx="186" cy="646" r="2" fill="#3c5562"/>
    <text x="198" y="650" class="mono tiny">IMMUTABLE HISTORY</text>
    <circle cx="344" cy="646" r="2" fill="#3c5562"/>
    <text x="356" y="650" class="mono tiny">ANCHORED FEEDBACK</text>
    <text x="1146" y="650" text-anchor="end" class="mono tiny mint-text">open-agent-artifacts</text>
  </g>
</svg>
