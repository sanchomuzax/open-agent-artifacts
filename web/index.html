<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Private artifact catalog and review workspace">
  <title>Artifacts — Open Agent Artifacts</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar catalog-topbar">
    <a class="brand-lockup" href="/" aria-label="Artifacts home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>
        <span class="eyebrow">OPEN AGENT</span>
        <strong>Artifacts</strong>
      </span>
    </a>
    <div class="catalog-top-actions">
      <label class="top-search" for="catalog-search">
        <span aria-hidden="true">⌕</span>
        <span class="sr-only">Search artifacts</span>
        <input id="catalog-search" type="search" placeholder="Search artifacts" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="view-toggle" role="group" aria-label="Catalog view">
        <button id="grid-view" class="view-button active" data-view="grid" type="button" aria-pressed="true" title="Grid view">▦</button>
        <button id="list-view" class="view-button" data-view="list" type="button" aria-pressed="false" title="List view">☷</button>
      </div>
      <button id="new-artifact" class="button primary" type="button"><span aria-hidden="true">＋</span> New artifact</button>
    </div>
  </header>

  <main id="catalog" class="catalog-page artifact-catalog" aria-labelledby="catalog-title">
    <section class="catalog-heading">
      <div>
        <p class="eyebrow">YOUR WORKSPACE</p>
        <h1 id="catalog-title">Artifacts</h1>
      </div>
      <span id="artifact-count" class="catalog-count">0</span>
    </section>

    <nav id="scope-tabs" class="scope-tabs" aria-label="Artifact scope">
      <button class="scope-tab active" type="button" data-scope="all">All</button>
      <button class="scope-tab" type="button" data-scope="pinned">Pinned</button>
      <button class="scope-tab identity-tab" type="button" data-scope="yours">Yours</button>
      <button class="scope-tab identity-tab" type="button" data-scope="shared">Shared with you</button>
    </nav>

    <div id="catalog-status" class="status" role="status" aria-live="polite"></div>
    <section id="artifact-list" class="artifact-grid" aria-label="Artifacts"></section>
    <div id="catalog-more" class="catalog-more" hidden>
      <button id="load-more" class="button secondary" type="button">Load more</button>
    </div>
  </main>

  <main id="workspace" class="workspace-page" hidden aria-live="polite"></main>

  <dialog id="new-artifact-dialog" class="modal-dialog">
    <form id="new-artifact-form" class="modal-card">
      <div class="modal-heading">
        <div>
          <p class="eyebrow">NEW ARTIFACT</p>
          <h2>Create artifact</h2>
        </div>
        <button id="close-new-artifact" class="icon-button" type="button" aria-label="Close">×</button>
      </div>
      <label for="new-artifact-title">Title</label>
      <input id="new-artifact-title" type="text" maxlength="512" required placeholder="Decision brief, release notes…">
      <label for="new-artifact-kind">Type</label>
      <select id="new-artifact-kind">
        <option value="markdown">Markdown document</option>
        <option value="text">Plain text</option>
        <option value="code">Code</option>
        <option value="html">HTML document</option>
        <option value="svg">SVG document</option>
        <option value="mermaid">Mermaid diagram</option>
      </select>
      <label for="new-artifact-content">Content</label>
      <textarea id="new-artifact-content" rows="11" required placeholder="# Start here"></textarea>
      <p id="new-artifact-status" class="status" role="status"></p>
      <div class="modal-actions">
        <button id="cancel-new-artifact" class="button secondary" type="button">Cancel</button>
        <button class="button primary" type="submit">Create artifact</button>
      </div>
    </form>
  </dialog>

  <!-- Static contract markers; the interactive controls are rendered by app.js. -->
  <template id="legacy-contract-markers" hidden>
    <button id="cards-view" type="button">Cards</button>
    <form id="new-version-form"></form>
    <button id="comments-toggle" type="button">Comments</button>
    <span class="highlighted-quote"></span>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
